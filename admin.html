<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>School Manager — Customers</title>
    <!-- Customer list. NOT linked from index.html. -->
    <style>
      :root {
        --bg: #0b1424;
        --surface: #121f35;
        --surface-2: #1a2c47;
        --ink: #edf5ff;
        --muted: #9db0c7;
        --line: #223650;
        --blue: #4b83ff;
        --green: #25d584;
        --red: #ff4d55;
        --orange: #f39b4a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: Tahoma, "Segoe UI", Arial, sans-serif;
        padding: 28px 18px 80px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 22px; }
      .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
      input, textarea {
        background: var(--surface-2); border: 1px solid var(--line);
        color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 0.85rem;
      }
      button {
        background: var(--blue); color: #fff; border: 0; border-radius: 8px;
        padding: 9px 14px; font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      }
      button.ghost { background: var(--surface-2); }
      button:disabled { opacity: 0.5; cursor: default; }
      table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
      tr:hover td { background: #ffffff08; }
      .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
      .pill.activated { background: #25d58422; color: var(--green); }
      .pill.trial { background: #4b83ff22; color: var(--blue); }
      .pill.suspended_trial { background: #f39b4a22; color: var(--orange); }
      .pill.suspended { background: #ff4d5522; color: var(--red); }
      .pill.locked { background: #ff4d55; color: #fff; }
      .muted { color: var(--muted); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
      .card.is-locked { border-color: var(--red); }
      button.danger { background: var(--red); }
      .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
      .edit-grid label { display: grid; gap: 4px; font-size: 0.75rem; color: var(--muted); }
      .edit-grid .full { grid-column: 1 / -1; }
      #error { color: var(--red); font-size: 0.85rem; margin: 10px 0; }
      @media (max-width: 760px) {
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; }
        tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; padding: 6px; }
        td { border: 0; }
        .edit-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="app">
        <h1>Customers</h1>
        <p class="sub" id="count"></p>
        <div class="bar">
          <input id="q" type="search" placeholder="Filter by school, phone, email…" style="flex:1;min-width:200px" />
          <button id="reload" class="ghost">Reload</button>
        </div>
        <p id="error"></p>
        <div id="list"></div>
      </div>
    </div>
    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fmtDate = (ms) => (ms ? new Date(ms).toLocaleString() : "—");

      let customers = [];

      async function api(path, opts) {
        const res = await fetch(path, opts);
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error("Request failed: " + (data.code || res.status));
        return data;
      }

      function pill(status) {
        return '<span class="pill ' + esc(status) + '">' + esc(status) + "</span>";
      }

      function render() {
        const q = ($("#q").value || "").toLowerCase();
        const rows = customers.filter((c) =>
          !q ||
          [c.school_name, c.phone, c.email, c.address].some((v) => (v || "").toLowerCase().includes(q)),
        );
        $("#count").textContent = rows.length + " customer(s). Status is the latest reported device state; suspended is reserved for the future lock system.";
        $("#list").innerHTML = rows.map((c) =>
          '<div class="card' + (c.lockdown ? " is-locked" : "") + '" data-id="' + esc(c.id) + '">' +
          "<div><strong>" + esc(c.school_name || "(unnamed)") + "</strong> " + pill(c.status) +
          (c.lockdown ? ' <span class="pill locked">LOCKED</span>' : "") +
          ' <span class="muted">' + esc(c.id) + " · " + (c.device_count || 0) + " device(s) · v" + esc(c.app_version || "?") + " · last seen " + esc(fmtDate(c.last_seen_at)) + "</span></div>" +
          '<div class="muted">Phone: ' + esc(c.phone || "—") + " · Email: " + esc(c.email || "—") + " · Address: " + esc(c.address || "—") + "</div>" +
          (c.notes ? "<div>Notes: " + esc(c.notes) + "</div>" : "") +
          '<div class="muted">TEST — first seen: ' + esc(fmtDate(c.created_at)) +
          " · license states: " + esc((c.license_states || []).join(", ") || "—") + "</div>" +
          '<div class="muted">TEST — devices: ' + ((c.devices || []).map((d) =>
            esc(d.id) + " (" + esc(d.license_state) + ", v" + esc(d.app_version || "?") +
            ", first " + esc(fmtDate(d.first_seen_at)) + ", last " + esc(fmtDate(d.last_seen_at)) + ")",
          ).join(" · ") || "—") + "</div>" +
          '<div class="bar" style="margin:10px 0 0"><button data-edit="' + esc(c.id) + '" class="ghost">Edit contact info</button>' +
          (c.lockdown
            ? '<button data-unlock="' + esc(c.id) + '" class="ghost">UNLOCK</button>'
            : '<button data-lock="' + esc(c.id) + '" class="danger">LOCKDOWN</button>') +
          '<span class="muted" data-lockmsg></span></div>' +
          '<div class="edit-grid" data-form="' + esc(c.id) + '" hidden>' +
          '<label>School name<input data-f="school_name" value="' + esc(c.school_name || "") + '"></label>' +
          '<label>Phone<input data-f="phone" value="' + esc(c.phone || "") + '"></label>' +
          '<label>Email<input data-f="email" value="' + esc(c.email || "") + '"></label>' +
          '<label>Address<input data-f="address" value="' + esc(c.address || "") + '"></label>' +
          '<label class="full">Notes<textarea data-f="notes" rows="2">' + esc(c.notes || "") + "</textarea></label>" +
          '<div class="full bar"><button data-save="' + esc(c.id) + '">Save</button><span class="muted" data-msg></span></div>' +
          "</div></div>",
        ).join("") || '<p class="muted">No customers yet.</p>';
      }

      async function load() {
        $("#error").textContent = "";
        try {
          const data = await api("/api/v1/admin/customers");
          customers = data.customers;
          render();
        } catch (e) {
          $("#error").textContent = e.message;
        }
      }

      document.addEventListener("click", async (e) => {
        const edit = e.target.closest("[data-edit]");
        if (edit) {
          const form = document.querySelector('[data-form="' + edit.dataset.edit + '"]');
          if (form) form.hidden = !form.hidden;
          return;
        }
        const lockBtn = e.target.closest("[data-lock],[data-unlock]");
        if (lockBtn) {
          const id = lockBtn.dataset.lock || lockBtn.dataset.unlock;
          const card = lockBtn.closest(".card");
          const msg = card ? card.querySelector("[data-lockmsg]") : null;
          const lockdown = lockBtn.hasAttribute("data-lock");
          if (msg) msg.textContent = lockdown ? "Locking…" : "Unlocking…";
          try {
            const data = await api("/api/v1/admin/customers/" + encodeURIComponent(id), {
              method: "PATCH",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ lockdown }),
            });
            customers = customers.map((c) => (c.id === id ? { ...c, ...data.customer } : c));
            render();
          } catch (err) {
            if (msg) msg.textContent = err.message;
          }
          return;
        }
        const save = e.target.closest("[data-save]");
        if (save) {
          const id = save.dataset.save;
          const form = document.querySelector('[data-form="' + id + '"]');
          const msg = form.querySelector("[data-msg]");
          const patch = {};
          form.querySelectorAll("[data-f]").forEach((el) => { patch[el.dataset.f] = el.value; });
          msg.textContent = "Saving…";
          try {
            const data = await api("/api/v1/admin/customers/" + encodeURIComponent(id), {
              method: "PATCH",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(patch),
            });
            customers = customers.map((c) => (c.id === id ? { ...c, ...data.customer } : c));
            msg.textContent = "Saved.";
            render();
          } catch (err) {
            msg.textContent = err.message;
          }
        }
      });

      $("#q").addEventListener("input", render);
      $("#reload").addEventListener("click", load);

      load();
    </script>
  </body>
</html>
